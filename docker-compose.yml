services:
  db:
    image: postgres:16-alpine
    environment:
      # 超级用户仅用于初始化与管理（生产密码必填，缺失时 compose 直接报错）
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?请在根 .env 中设置 POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      # 应用专用账号密码（init.sh 创建时使用）
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?请在根 .env 中设置 APP_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动创建应用账号与业务库（权限最小化）
      - ./server/db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./server
    # 复用 server/.env（DEEPSEEK_API_KEY 等），文件已被 .gitignore 排除
    env_file: ./server/.env
    # 容器内数据库主机名是 db；应用使用最小权限专用账号，不用超级用户
    # （environment 优先级高于 env_file，覆盖 .env 里指向 localhost 的 DATABASE_URL）
    environment:
      DATABASE_URL: postgresql://plagent:${APP_DB_PASSWORD:?请在根 .env 中设置 APP_DB_PASSWORD}@db:5432/plagent
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:

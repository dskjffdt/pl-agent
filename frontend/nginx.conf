server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头：nosniff 防 MIME 嗅探、DENY 防点击劫持、Referrer 收敛
    # CSP 收紧为自源 + 内联样式（Tailwind/React 动态样式需要 unsafe-inline）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    # https 部署时放开（本地 http 开启会导致浏览器强制跳转 https）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口代理（与开发时 vite proxy 对齐）
    location /chat/completions {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # SSE 流式必需：关闭 Nginx 缓冲，否则流式响应会被攒到一起
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /conversations {
        proxy_pass http://backend:8000;
    }

    location /login {
        proxy_pass http://backend:8000;
    }

    location /logout {
        proxy_pass http://backend:8000;
    }
}
